name: Release smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  published-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run the published no-clone Action
        id: audit
        uses: however-yir/evidencelint@v0.1.0
        with:
          format: json
          output: /tmp/evidencelint-release-smoke.json
          token: ${{ github.token }}

      - name: Verify the published report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/evidencelint-release-smoke.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["snapshot"]["repository"] == "${{ github.repository }}"
          assert report["schema_version"] == "evidencelint-report-v1"
          assert report["rule_set_version"] == "evidencelint-rules-v2"
          assert len(report["findings"]) == 13
          assert all(item["status"] != "unavailable" for item in report["findings"])
          PY
