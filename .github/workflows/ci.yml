name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Compile package and tests
        run: python -m compileall -q src tests scripts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/evidencelint-release-check
          /tmp/evidencelint-release-check/bin/python -m pip install \
            --no-index --find-links dist evidencelint==0.2.0
          cd /tmp
          /tmp/evidencelint-release-check/bin/evidencelint --version

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the local no-clone action
        id: audit
        uses: ./
        with:
          format: json
          output: /tmp/evidencelint-action-report.json
          token: ${{ github.token }}
      - name: Verify action output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/evidencelint-action-report.json").read_text(encoding="utf-8")
          )
          assert report["snapshot"]["repository"] == "${{ github.repository }}"
          assert report["rule_set_version"] == "evidencelint-rules-v2"
          PY

      - name: Compare the action report against itself
        id: comparison
        uses: ./
        with:
          format: json
          baseline: /tmp/evidencelint-action-report.json
          output: /tmp/evidencelint-action-comparison.json
          token: ${{ github.token }}
          strict: "true"
      - name: Verify comparison output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/evidencelint-action-comparison.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["schema_version"] == "evidencelint-comparison-v1"
          assert report["summary"]["new_blocker"] == 0
          PY

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check coverage==7.15.2 mypy==1.18.2 ruff==0.13.0
      - name: Run static quality checks
        env:
          PYTHONPATH: src
        run: |
          ruff check src tests scripts
          mypy src/evidencelint
          coverage run -m unittest discover -s tests
          coverage report --fail-under=90
